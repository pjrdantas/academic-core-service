server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: academic-core-service

  docker:
    compose:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: academic-core-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      properties:
        "[spring.json.add.type.headers]": false

    listener:
      ack-mode: manual
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    "org.springframework.kafka": INFO
  pattern:
    level: "%5p [eventId=%X{eventId}] [sagaId=%X{sagaId}]"

