spring:
  application:
    name: academic-core-service

  datasource:
    url: jdbc:postgresql://localhost:5432/db_gestao_escolar
    username: postgres
    password: root123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: academic-core-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        "spring.deserializer.value.delegate.class": org.springframework.kafka.support.serializer.JsonDeserializer
        "spring.json.trusted.packages": br.com.escola.academic.domain.event
        "spring.json.use.type.headers": false
        "spring.json.value.default.type": br.com.escola.academic.domain.event.MatriculaCriadaEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        "[spring.json.add.type.headers]": false

    listener:
      ack-mode: manual

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    "org.springframework.kafka": INFO
  pattern:
    level: "%5p [eventId=%X{eventId}] [sagaId=%X{sagaId}]"
